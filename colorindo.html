<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorindo a Bíblia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comic Sans MS','Segoe UI',Arial,sans-serif;background:#fdf6e3;color:#333}
nav{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,#7c3aed,#4f46e5);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
nav h1{font-size:1.3em;flex:1;min-width:150px}
nav button{background:#fff;color:#4f46e5;border:none;border-radius:20px;padding:10px 16px;font-size:1em;font-weight:bold;cursor:pointer}
nav button.active{background:#fbbf24;color:#333}
main{padding:16px;max-width:1100px;margin:0 auto}
.section{display:none}
.section.active{display:block}
h2{text-align:center;color:#4f46e5;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:14px}
.card{background:#fff;border-radius:18px;padding:16px;text-align:center;cursor:pointer;border:3px solid #e5e7eb;transition:transform .15s,box-shadow .15s}
.card:hover{transform:scale(1.05);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.card .ico{font-size:2.6em;display:block;margin-bottom:6px}
.card .nm{font-weight:bold;color:#333}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;background:#fff;padding:10px;border-radius:14px;border:2px solid #e5e7eb}
.toolbar button{background:#eef2ff;border:2px solid #c7d2fe;border-radius:12px;padding:8px 12px;cursor:pointer;font-size:.95em;font-weight:bold}
.toolbar button:hover{background:#c7d2fe}
.palette{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid #999;cursor:pointer}
.sw.sel{border:4px solid #4f46e5;transform:scale(1.15)}
.color-screen{display:flex;flex-wrap:wrap;gap:16px}
.svg-wrap{flex:1;min-width:320px;background:#fff;border-radius:16px;border:3px solid #e5e7eb;padding:10px}
.svg-wrap svg{width:100%;height:auto;display:block}
.story-panel{flex:1;min-width:300px;background:#fff;border-radius:16px;border:3px solid #e5e7eb;padding:16px}
.story-panel h3{color:#4f46e5;margin-bottom:8px}
.story-panel p{line-height:1.6;margin-bottom:10px}
.verse{background:#fef9c3;border:2px solid #fde047;border-radius:12px;padding:12px;margin:10px 0;font-style:italic}
.verse .ref{display:block;text-align:right;font-weight:bold;margin-top:4px}
.bigbtn{background:#4f46e5;color:#fff;border:none;border-radius:14px;padding:12px 18px;font-size:1.05em;cursor:pointer;margin:4px}
.bigbtn:hover{background:#3730a3}
.bigbtn.green{background:#16a34a}.bigbtn.green:hover{background:#15803d}
.bigbtn.red{background:#dc2626}.bigbtn.red:hover{background:#b91c1c}
.bigbtn.amber{background:#d97706}.bigbtn.amber:hover{background:#b45309}
select{font-size:1em;padding:8px;border-radius:10px;border:2px solid #c7d2fe}
.game-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:14px}
.game-card{background:#fff;border-radius:18px;padding:20px;text-align:center;cursor:pointer;border:3px solid #e5e7eb}
.game-card:hover{transform:scale(1.04);box-shadow:0 6px 16px rgba(0,0,0,.15)}
.game-card .ico{font-size:2.8em;display:block;margin-bottom:6px}
.game-area{background:#fff;border-radius:16px;border:3px solid #e5e7eb;padding:16px;margin-top:10px;text-align:center}
.word-display{font-size:2em;letter-spacing:8px;font-weight:bold;margin:14px 0;color:#4f46e5}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:520px;margin:10px auto}
.letters button{width:38px;height:38px;border-radius:8px;border:2px solid #c7d2fe;background:#eef2ff;font-size:1em;font-weight:bold;cursor:pointer}
.letters button:disabled{opacity:.35;cursor:default}
.hint{background:#fef9c3;border-radius:10px;padding:8px;margin:8px auto;max-width:480px}
.mem-grid{display:grid;gap:8px;justify-content:center;margin:12px auto}
.mem-card{width:70px;height:84px;background:#4f46e5;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:2em;cursor:pointer;border:2px solid #3730a3;transition:transform .2s}
.mem-card.flip{background:#fff;border-color:#16a34a}
.mem-card.done{background:#bbf7d0;border-color:#16a34a;cursor:default}
.opt{display:block;width:100%;max-width:480px;margin:6px auto;padding:12px;border-radius:12px;border:2px solid #c7d2fe;background:#eef2ff;font-size:1.05em;cursor:pointer}
.opt:hover{background:#c7d2fe}
.opt.correct{background:#bbf7d0;border-color:#16a34a}
.opt.wrong{background:#fecaca;border-color:#dc2626}
.puzzle-grid{display:grid;grid-template-columns:repeat(3,90px);gap:4px;justify-content:center;margin:12px auto}
.pz{width:90px;height:90px;border-radius:10px;background:#fbbf24;display:flex;align-items:center;justify-content:center;font-size:2em;cursor:pointer;border:2px solid #d97706;font-weight:bold;color:#333}
.pz.empty{background:transparent;border:2px dashed #ccc;cursor:default}
.ws-grid{display:grid;gap:2px;justify-content:center;margin:12px auto}
.ws-cell{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid #e5e7eb;font-weight:bold;font-size:1.05em;cursor:pointer;background:#fff;border-radius:4px;user-select:none}
.ws-cell.found{background:#bbf7d0;color:#16a34a}
.ws-cell.sel{background:#fde047}
.wordlist{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.wordlist span{background:#eef2ff;border-radius:8px;padding:4px 10px;font-weight:bold}
.wordlist span.found{background:#bbf7d0;text-decoration:line-through}
.score{font-size:1.2em;font-weight:bold;color:#4f46e5;margin:8px 0}
.msg{font-size:1.3em;font-weight:bold;margin:12px 0;color:#4f46e5}
@media print{
  body *{visibility:hidden !important}
  #printArea,#printArea *{visibility:visible !important}
  #printArea{position:absolute;left:0;top:0;width:100%}
  #printArea .print-item{page-break-after:always;text-align:center}
  #printArea .print-item svg{width:80%;height:auto}
  nav,.toolbar,.story-panel,.bigbtn,.game-area{display:none !important}
}
</style>
</head>
<body>
<nav>
  <h1>🌈 Colorindo a Bíblia</h1>
  <button id="btnColorir" class="active" onclick="showSection('colorir')">🎨 Colorir</button>
  <button id="btnJogos" onclick="showSection('jogos')">🎮 Jogos</button>
  <button id="btnSound" onclick="toggleSound()">🔊</button>
</nav>

<main>
  <div id="sec-colorir" class="section active">
    <h2>Escolha um personagem para colorir e ouvir a história!</h2>
    <div style="text-align:center"><button class="bigbtn amber" onclick="printAll()">🖨️ Imprimir todos os desenhos</button></div>
    <div id="homeGrid" class="grid"></div>
    <div id="colorScreen" style="display:none">
      <div style="margin:8px 0"><button class="bigbtn red" onclick="backHome()">⬅️ Voltar</button></div>
      <div class="toolbar">
        <div class="palette" id="palette"></div>
        <button onclick="setTool('eraser')" id="btnEraser">🧽 Borracha</button>
        <button onclick="setBrush(2)">Pincel P</button>
        <button onclick="setBrush(4)">Pincel M</button>
        <button onclick="setBrush(6)">Pincel G</button>
        <button onclick="clearAll()">🗑️ Limpar tudo</button>
        <button onclick="undo()">↩️ Desfazer</button>
        <button class="bigbtn amber" style="margin:0" onclick="printSingle()">🖨️ Imprimir desenho</button>
      </div>
      <div class="color-screen">
        <div class="svg-wrap" id="svgWrap"></div>
        <div class="story-panel" id="storyPanel"></div>
      </div>
    </div>
  </div>

  <div id="sec-jogos" class="section">
    <h2>🎮 Jogos Bíblicos</h2>
    <div id="gameMenu" class="game-menu"></div>
    <div id="gameArea" class="game-area" style="display:none"></div>
  </div>
</main>

<div id="printArea" style="display:none"></div>

<script>
// ===== DADOS DOS PERSONAGENS =====
const CHARS = [
{id:'noe',ico:'⛵',name:'Noé e a Arca',story:'Deus pediu a Noé que construísse uma arca bem grande, porque viria uma chuva forte. Noé obedeceu e levou sua família e um casal de cada animal para dentro da arca. Choveu por muitos dias, mas a arca flutuou em segurança. Quando a chuva parou, Deus colocou um lindo arco-íris no céu, como sinal da sua promessa de cuidar de todos.',verse:'Pus o meu arco nas nuvens, e ele será o sinal da aliança entre mim e a terra.',ref:'Gênesis 9:13',

// ===== ESTADO =====
let curChar=null, curColor='#e11d48', curTool='fill', brushW=3, undoStack=[];
let soundOn = localStorage.getItem('cb_sound')!=='off';
let selVoice = localStorage.getItem('cb_voice')||'';

// ===== SOM =====
let actx=null;
function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function tone(f,d,when=0,type='sine'){ if(!soundOn) return; const c=audio(),o=c.createOscillator(),g=c.createGain(); o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=c.currentTime+when;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.2,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.start(t);o.stop(t+d+0.05); }
const sClick=()=>tone(600,0.08);
const sFlip=()=>{tone(400,0.06);tone(500,0.06,0.05);};
const sSlide=()=>tone(300,0.05);
const sError=()=>tone(180,0.25,'', 'triangle');
const sSuccess=()=>{tone(523,0.12);tone(659,0.12,0.1);tone(784,0.2,0.2);};
const sWin=()=>{tone(523,0.15);tone(659,0.15,0.12);tone(784,0.15,0.24);tone(1047,0.3,0.36);};
const sChime=()=>{tone(880,0.15);tone(1175,0.2,0.1);};
function toggleSound(){ soundOn=!soundOn; localStorage.setItem('cb_sound',soundOn?'on':'off'); document.getElementById('btnSound').textContent=soundOn?'🔊':'🔇'; }

// ===== NAVEGAÇÃO =====
function showSection(s){
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  document.getElementById('sec-'+s).classList.add('active');
  document.getElementById('btnColorir').classList.toggle('active',s==='colorir');
  document.getElementById('btnJogos').classList.toggle('active',s==='jogos');
  speechSynthesis.cancel();
  if(s==='colorir'&&!curChar) backHome();
  if(s==='jogos') showGameMenu();
}

// ===== COLORIR =====
function renderHome(){
  const g=document.getElementById('homeGrid'); g.innerHTML='';
  CHARS.forEach(c=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<span class="ico">${c.ico}</span><div class="nm">${c.name}</div>`;
    d.onclick=()=>{sClick();openChar(c.id);};
    g.appendChild(d);
  });
}
function openChar(id){
  curChar=CHARS.find(c=>c.id===id); undoStack=[];
  document.getElementById('homeGrid').style.display='none';
  document.getElementById('colorScreen').style.display='block';
  buildPalette(); renderSVG(); renderStory();
}
function backHome(){
  speechSynthesis.cancel(); curChar=null;
  document.getElementById('homeGrid').style.display='grid';
  document.getElementById('colorScreen').style.display='none';
}
function buildPalette(){
  const colors=['#e11d48','#f97316','#facc15','#22c55e','#3b82f6','#8b5cf6','#ec4899','#92400e','#9ca3af','#111827','#ffffff','#f5cba7'];
  const p=document.getElementById('palette'); p.innerHTML='';
  colors.forEach(c=>{
    const s=document.createElement('div'); s.className='sw'+(c===curColor?' sel':'');
    s.style.background=c; s.onclick=()=>{curColor=c;curTool='fill';sClick();buildPalette();};
    p.appendChild(s);
  });
}
function setTool(t){ curTool=t; sClick(); }
function setBrush(b){ brushW=b; sClick(); }
function renderSVG(){
  const w=document.getElementById('svgWrap');
  w.innerHTML=`<svg viewBox="0 0 400 300" id="mainSvg">${curChar.svg}</svg>`;
  const svg=document.getElementById('mainSvg');
  svg.querySelectorAll('.c').forEach(el=>{
    el.style.cursor='pointer';
    el.addEventListener('click',e=>{ e.stopPropagation(); fillShape(el); });
  });
}
function fillShape(el){
  const prev=el.getAttribute('fill');
  undoStack.push({el,prev});
  const col = curTool==='eraser' ? '#ffffff' : curColor;
  el.setAttribute('fill',col);
  el.setAttribute('stroke-width',brushW);
  sClick();
}
function undo(){
  const u=undoStack.pop(); if(!u) return;
  u.el.setAttribute('fill',u.prev); sClick();
}
function clearAll(){
  if(!curChar) return;
  document.querySelectorAll('#mainSvg .c').forEach(el=>el.setAttribute('fill','#ffffff'));
  undoStack=[]; sClick();
}
function renderStory(){
  const p=document.getElementById('storyPanel');
  p.innerHTML=`<h3>${curChar.ico} ${curChar.name}</h3>
  <p>${curChar.story}</p>
  <div class="verse">📖 "${curChar.verse}"<span class="ref">${curChar.ref}</span></div>
  <button class="bigbtn green" onclick="narrate()">🔊 Ouvir história</button>
  <button class="bigbtn red" onclick="speechSynthesis.cancel()">⏹ Parar</button>
  <div style="margin-top:10px"><label>🎙️ Voz da narração:<br><select id="voiceSel" onchange="saveVoice(this.value)"></select></label></div>`;
  populateVoices();
}
function populateVoices(){
  const sel=document.getElementById('voiceSel'); if(!sel) return;
  const vs=speechSynthesis.getVoices();
  sel.innerHTML='';
  const sorted=[...vs].sort((a,b)=>(a.lang+' '+a.name).localeCompare(b.lang+' '+b.name));
  sorted.forEach(v=>{ const o=document.createElement('option'); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o); });
  if(selVoice){ const found=[...sel.options].find(o=>o.value===selVoice); if(found) sel.value=selVoice; }
}
function saveVoice(v){ selVoice=v; localStorage.setItem('cb_voice',v); }
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  if(selVoice){ const f=vs.find(v=>v.name===selVoice); if(f) return f; }
  const pref=['francisca','camila','luciana','maria','thalita','google português','microsoft maria','microsoft francisca'];
  for(const n of pref){ const f=vs.find(v=>v.name.toLowerCase().includes(n)); if(f) return f; }
  return vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith('pt'))||vs[0]||null;
}
function narrate(){
  if(!curChar) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(`${curChar.story} Versículo: ${curChar.verse}. ${curChar.ref}`);
  u.lang='pt-BR'; const v=pickVoice(); if(v) u.voice=v;
  u.rate=0.95; speechSynthesis.speak(u);
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=populateVoices; }

// ===== IMPRESSÃO =====
function svgForPrint(ch,white=true){
  const div=document.createElement('div'); div.innerHTML=ch.svg;
  const svg=div.querySelector('svg');
  svg.setAttribute('viewBox','0 0 400 300');
  if(white) svg.querySelectorAll('.c').forEach(el=>el.setAttribute('fill','#ffffff'));
  svg.setAttribute('width','100%');
  return svg.outerHTML;
}
function printSingle(){
  if(!curChar) return;
  const pa=document.getElementById('printArea');
  pa.style.display='block';
  pa.innerHTML=`<div class="print-item"><h3>${curChar.name}</h3>${svgForPrint(curChar)}</div>`;
  window.print(); pa.style.display='none';
}
function printAll(){
  const pa=document.getElementById('printArea');
  pa.style.display='block';
  pa.innerHTML=CHARS.map(c=>`<div class="print-item"><h3>${c.name}</h3>${svgForPrint(c)}</div>`).join('');
  window.print(); pa.style.display='none';
}

  mState.open=[]; mRender();
}

let wState=null;
function wNew(){
  const size=12; const grid=Array.from({length:size},()=>Array(size).fill(''));
  const placed=[];
  const words=[...CW].sort(()=>Math.random()-0.5);
  words.forEach(w=>{
    let ok=false,tries=0;
    while(!ok&&tries<100){ tries++;
      const horiz=Math.random()<0.5; const r=Math.floor(Math.random()*size),c=Math.floor(Math.random()*size);
      const dr=horiz?0:1,dc=horiz?1:0;
      const er=r+w.length*dr, ec=c+w.length*dc;
      if(er>size||ec>size) continue;
      let fit=true;
      for(let i=0;i<w.length;i++){ const ch=grid[r+i*dr][c+i*dc]; if(ch&&ch!==w[i]){fit=false;break;} }
      if(!fit) continue;
      for(let i=0;i<w.length;i++) grid[r+i*dr][c+i*dc]=w[i];
      placed.push({w,start:[r,c],dir:[dr,dc]}); ok=true;
    }
  });
  for(let r=0;r<size;r++) for(let c=0;c<size;c++) if(!grid[r][c]) grid[r][c]='ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)];
  wState={grid,placed,found:new Set(),sel:null};
  wRender();
}

  const g=document.getElementById('wGrid');
  g.style.gridTemplateColumns=`repeat(${wState.grid.length},34px)`;
  g.innerHTML='';
  wState.grid.forEach((row,r)=>row.forEach((ch,c)=>{
    const d=document.createElement('div'); d.className='ws-cell'; d.textContent=ch; d.dataset.r=r; d.dataset.c=c;
    if(wState.found.has(r+','+c)) d.classList.add('found');
    d.onclick=()=>wPick(r,c,d);
    g.appendChild(d);
  }));
  const wl=document.getElementById('wList'); wl.innerHTML='';
  wState.placed.forEach(p=>{
    const s=document.createElement('span'); s.textContent=p.w; s.id='wl-'+p.w;
    if(p.w.split('').every((_,i)=>wState.found.has((p.start[0]+i*p.dir[0])+','+(p.start[1]+i*p.dir[1])))) s.classList.add('found');
    wl.appendChild(s);
  });
  const allFound=wState.placed.every(p=>p.w.split('').every((_,i)=>wState.found.has((p.start[0]+i*p.dir[0])+','+(p.start[1]+i*p.dir[1]))));
  document.getElementById('wMsg').textContent=allFound?'🎉 Você encontrou todas as palavras!':'';
  if(allFound) sWin();
}
function wPick(r,c,d){
  const key=r+','+c;
  if(!wState.sel){ wState.sel={r,c}; d.classList.add('sel'); return; }
  const s=wState.sel; wState.sel=null;
  document.querySelectorAll('.ws-cell.sel').forEach(x=>x.classList.remove('sel'));
  const dr=Math.sign(r-s.r), dc=Math.sign(c-s.c);
  if((dr===0&&dc===0)||(dr!==0&&dc!==0)) return;
  const len=Math.max(Math.abs(r-s.r),Math.abs(c-s.c))+1;
  let word='';
  for(let i=0;i<len;i++) word+=wState.grid[s.r+i*dr][s.c+i*dc];
  const p=wState.placed.find(p=>p.w===word);
  if(p){ for(let i=0;i<word.length;i++) wState.found.add((s.r+i*dr)+','+(s.c+i*dc)); sChime(); wRender(); }
  else sError();
}
